name: Build

on:
  push:
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "certs/**"
      - "docker-compose.*"
      - "Dockerfile"
      - ".dockerignore"

jobs:
  backend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: 'src/backend'
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Check for unapplied EF model changes
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          dotnet ef migrations has-pending-model-changes -s src/FoodDiary.API -p src/FoodDiary.Infrastructure
      - name: Run unit tests
        run: dotnet test tests/FoodDiary.UnitTests --no-restore --verbosity normal
      - name: Run component tests
        run: dotnet test tests/FoodDiary.ComponentTests --no-restore --verbosity normal
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: 'src/frontend'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install
        run: yarn install
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test
  e2e-tests:
    needs:
      - backend
      - frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 'tests'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Start containers
      run: docker compose up -d --build
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install dependencies
      run: yarn
    - name: Lint
      run: yarn lint
    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps
    - name: Run Playwright tests
      run: yarn playwright test
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: tests/playwright-report/
        retention-days: 30
    - name: Stop containers
      if: always()
      run: docker compose down
